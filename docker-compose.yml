services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./nexus_r.db
      REDIS_URL: redis://localhost:6379/0
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      APP_ENV: development
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
