services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: codecommit
      POSTGRES_PASSWORD: codecommit
      POSTGRES_DB: nexus_r
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codecommit -d nexus_r"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://codecommit:codecommit@postgres:5432/nexus_r
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      APP_ENV: development
      DATA_MODE: simulation
      SSE_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
